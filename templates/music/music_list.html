{% extends 'base.html'%}

{% block content %}
<div class="container-fluid music_genre_list">
    <div class="container d-flex justify-content-center gap-3 category_links">
        <a href="?genre=All" class="btn btn-dark {% if genre == 'All' %}active_category{% endif %} ">All</a>
        <a href="?genre=Pop" class="btn btn-dark {% if genre == 'Pop' %}active_category{% endif %}">Pop</a>
        <a href="?genre=Rock" class="btn btn-dark {% if genre == 'Rock' %}active_category{% endif %}">Rock</a>
        <a href="?genre=Blues" class="btn btn-dark {% if genre == 'Blues' %}active_category{% endif %}">Blues</a>
    </div>

    <div class="card card-main">
        <div class="row g-3">

            {% for track in tracks %}

            <div class="col-12 col-md-6 col-lg-4">

                <div class="card track-card mb-3 mt-5" style="background-color: aliceblue;">

                    <div class="row g-0 align-items-center">

                        <!-- COVER IMAGE -->
                        <div class="col-3 col-md-4">

                            {% if track.cover_image %}

                            <img src="{{ track.cover_image.url }}" alt="{{ track.title }}"
                                class="img-fluid rounded-start track-cover">

                            {% endif %}

                        </div>


                        <!-- TITLE + ARTIST -->
                        <div class="col-7 col-md-6">

                            <div class="card-body">

                                <h5 class="card-title">
                                    {{ track.title }}
                                </h5>

                                <p class="card-text">
                                    {{ track.artist }}
                                </p>

                            </div>

                        </div>


                        <!-- PLAY BUTTON -->
                        <div class="col-2 text-center">

                            <button class="btn btn-dark track-play-btn" data-title="{{ track.title }}"
                                data-audio="{% if track.audio_file.url %}{{ track.audio_file.url }}{% endif %}">

                                <i class="bi bi-play-fill"></i>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            {% empty %}

            {% if genre %}
            <p>No tracks available in {{ genre }}</p>
            {% endif %}

            {% endfor %}

        </div>
    </div>
</div>
</div>




{% endblock %}
